<title>Kilter Твистер</title>
<style>
:root { color-scheme: dark; --bg: #11151b; --panel: #191f27; --line: #2b3440; --fg: #e9edf2; --muted: #8d98a7; --danger: #ff7a6b; --accent: #00ff00; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.45 "IBM Plex Sans", "Segoe UI", Roboto, system-ui, sans-serif; display: grid; place-items: center; padding: 16px; box-sizing: border-box; }
form { width: 100%; max-width: 360px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px 18px; display: grid; gap: 12px; }
h1 { margin: 0; font: 700 1.6rem/1 "Barlow Condensed", "Arial Narrow", sans-serif; letter-spacing: .02em; text-transform: uppercase; }
p { margin: 0; color: var(--muted); font-size: .88rem; }
input { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
button { font: 700 1.1rem "Barlow Condensed", "Arial Narrow", sans-serif; letter-spacing: .06em; text-transform: uppercase; border: 0; border-radius: 12px; padding: 12px; background: var(--accent); color: #12100e; cursor: pointer; }
button:disabled { opacity: .5; cursor: default; }
#msg.bad { color: var(--danger); }
</style>
</head>
<body>
<form id="wait" hidden><h1>Kilter Твистер</h1><p id="waitMsg">Проверяю обновления…</p>
  <button id="retry" type="button" hidden>Проверить снова</button></form>

  <input id="pw" type="password" autocomplete="current-password" placeholder="Пароль" required>
  <button id="go" type="submit">Войти</button>
  <p id="msg"></p>
</form>

MN6IGm3RtecLawKUsajkslAaJF5YwaDlYrm+jKbaWqtD0Z4kPTO06zpm3zG4Ew81Q=","slots":[{"iv":"CKo+ekwmha/i2LrZ","k":"y9kR9w3SMpZEkCuFfIuuRcOV98HTvSpoR6hXD3nya07JkLhLah0B08zrlNl0AjZW"}]};
  const WEEK = 7 * 24 * 3600 * 1000, SLACK = 5 * 60 * 1000;
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const toB64 = (u) => btoa(String.fromCharCode(...new Uint8Array(u)));
  const ls = { get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } },
               set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }, del: (k) => { try { localStorage.removeItem(k); } catch (e) {} } };
  const $ = (id) => document.getElementById(id);
  const ddmm = (ms) => { const d = new Date(ms); return String(d.getDate()).padStart(2, "0") + "." + String(d.getMonth() + 1).padStart(2, "0"); };

  async function open(raw) {
    const kek = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
    let ck = null;
    for (const s of DATA.slots) {                       // whichever lock this password opens
      try { ck = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(s.iv) }, kek, b64(s.k)); break; } catch (e) {}
    }
    if (!ck) throw new Error("no slot");
    const key = await crypto.subtle.importKey("raw", ck, "AES-GCM", false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(DATA.iv) }, key, b64(DATA.ct));
    const html = new TextDecoder().decode(plain);
    // Replace this page only once it has finished loading: a document.open() while the login page is still
    // being parsed is ignored, and the app would be written into the login page (its styles mixed in).
    if (document.readyState !== "complete") await new Promise((r) => window.addEventListener("load", r, { once: true }));
    document.open(); document.write(html); document.close();
  }
  async function derive(pw) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw.normalize("NFC")), "PBKDF2", false, ["deriveBits"]);
    return crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: b64(DATA.salt), iterations: DATA.iter }, base, 256);
  }

  // ---- weekly update check ----
  // kilterChecked: last time the site answered; kilterSeen: latest clock time seen at launch (catches a clock set back).
  async function reachSite() {
    const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 8000);
    try { const r = await fetch("sw.js?check=" + Date.now(), { cache: "no-store", signal: ctl.signal }); return r.ok; }
    catch (e) { return false; } finally { clearTimeout(t); }
  }
  const now = Date.now(), seen = +ls.get("kilterSeen") || 0;
  let checked = +ls.get("kilterChecked") || 0;
  // first launch of this version: the page has just come from the site, so the week starts now
  // (otherwise a phone updated at home and opened offline in the gym would be locked out at once)
  if (!checked) { checked = now; ls.set("kilterChecked", String(now)); }
  const clockBack = now < seen - SLACK || now < checked - SLACK;
  const expired = now - checked > WEEK || clockBack;
  if (!clockBack) ls.set("kilterSeen", String(Math.max(seen, now)));
  // With the week over, a new version found by the check is switched on at once instead of at the next launch.
  async function applyUpdateNow() {
    if (!("serviceWorker" in navigator)) return false;
    const reg = await navigator.serviceWorker.getRegistration();
    if (!reg) return false;
    try { await reg.update(); } catch (e) {}
    const w = reg.waiting || await new Promise((res) => {
      const inst = reg.installing; if (!inst) return res(null);
      const t = setTimeout(() => res(null), 15000);
      inst.addEventListener("statechange", () => { if (inst.state === "installed") { clearTimeout(t); res(inst); } if (inst.state === "redundant") { clearTimeout(t); res(null); } });
    });
    if (!w || !navigator.serviceWorker.controller) return false;
    navigator.serviceWorker.addEventListener("controllerchange", () => location.reload());
    w.postMessage("update-now");
    return true;
  }

  const form = $("f"), msg = $("msg"), btn = $("go");
  const ask = (text, bad) => { $("wait").hidden = true; form.hidden = false; msg.textContent = text || ""; msg.className = bad ? "bad" : ""; $("pw").focus(); };
  form.onsubmit = async (e) => {
    e.preventDefault(); btn.disabled = true; msg.className = ""; msg.textContent = "Проверяю пароль…";
    try {
      const raw = await derive($("pw").value);
      await open(raw);
      ls.set("kilterKey", toB64(raw));
    } catch (err) { btn.disabled = false; ask("Неверный пароль.", true); }
  };
  function start() {
    const saved = ls.get("kilterKey");
    if (saved) open(b64(saved)).catch(() => { ls.del("kilterKey"); ask("Пароль сменился или доступ отозван — введите пароль.", true); });
    else ask();
  }
  if (!window.crypto || !crypto.subtle) { ask("Этот браузер не умеет расшифровывать приложение. Откройте его в Chrome по адресу https://…", true); return; }

  if (!expired) {
    start();
    reachSite().then((ok) => { if (ok) ls.set("kilterChecked", String(Date.now())); });   // quietly, in the background
  } else {
    $("wait").hidden = false;
    const tryCheck = async () => {
      $("retry").hidden = true; $("waitMsg").textContent = "Проверяю обновления…";
      if (await reachSite()) {
        ls.set("kilterChecked", String(Date.now())); ls.set("kilterSeen", String(Date.now()));
        $("waitMsg").textContent = "Загружаю новую версию…";
        if (await applyUpdateNow()) return;              // the page reloads into the new version
        $("wait").hidden = true; start();
      } else {
        $("waitMsg").textContent = (clockBack ? "Часы телефона переведены назад. " : "") +
          "Раз в неделю приложению нужен интернет, чтобы проверить обновления" +
          ` (последняя проверка ${ddmm(checked)})` + ". Подключитесь к интернету и нажмите «Проверить снова».";
        $("retry").hidden = false;
      }
    };
    $("retry").onclick = tryCheck;
    tryCheck();
  }
})();
